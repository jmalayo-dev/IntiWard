# Perfil "cloud" (EC2 + MySQL administrado: Aiven). Se activa con SPRING_PROFILES_ACTIVE=cloud.
# Sin valores por defecto: si falta una variable, el servicio no arranca (mejor que arrancar mal).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Aiven: max_connections = 46. 5 servicios x 4 = 20 (40 si un redespliegue se solapa)
      maximum-pool-size: ${DB_POOL_MAX:4}

intiguard:
  jwt:
    secret: ${JWT_SECRET}
  security:
    exigir-token: true

management:
  endpoint:
    health:
      show-details: never
