# Configuración por defecto (perfil local). Todo valor sensible entra por variable de entorno;
# los valores después de ":" son solo para desarrollo contra el MySQL de docker-compose (puerto 3307).
server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-inventario
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:db_inventario}
    username: ${DB_USER:usr_inventario}
    password: ${DB_PASSWORD:usr_inventario_local}
  jpa:
    hibernate:
      # El schema lo crea infra/mysql/*.sql; Hibernate solo valida que coincida
      ddl-auto: validate
    open-in-view: false

intiguard:
  jwt:
    secret: ${JWT_SECRET:clave-local-solo-para-desarrollo-no-usar-en-nube}
    expiration-minutes: 60

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
