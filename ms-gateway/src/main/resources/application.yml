server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Enrutamiento por prefijo. "lb://" significa: pedirle a Eureka dónde está el servicio
          routes:
            - id: ms-auth
              uri: lb://ms-auth
              predicates:
                - Path=/auth/**,/usuarios/**
            - id: ms-catalogo
              uri: lb://ms-catalogo
              predicates:
                - Path=/productos/**,/marcas/**,/categorias/**
            - id: ms-inventario
              uri: lb://ms-inventario
              predicates:
                - Path=/stock/**,/movimientos/**
            - id: ms-pedidos
              uri: lb://ms-pedidos
              predicates:
                - Path=/carrito/**,/pedidos/**
            - id: ms-comprobantes
              uri: lb://ms-comprobantes
              predicates:
                - Path=/comprobantes/**

# Contrato C4: seguridad en la puerta de entrada (filter/JwtGatewayFilter)
intiguard:
  jwt:
    secret: ${JWT_SECRET:clave-local-solo-para-desarrollo-no-usar-en-nube}
  security:
    # false mientras no exista el login (C3): el token se valida si llega, pero no es obligatorio
    exigir-token: ${EXIGIR_TOKEN:false}
    rutas-publicas:
      - POST /auth/login
      - POST /auth/registro
      - GET /productos/**
      - GET /marcas/**
      - GET /categorias/**
      - GET /stock
      - GET /stock/*
      - /actuator/health/**
    # Solo las llama ms-pedidos por Feign, dentro de la red. Desde afuera: 403 siempre.
    rutas-internas:
      - POST /stock/reservar
      - POST /stock/confirmar
      - POST /stock/liberar
      - POST /comprobantes

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
