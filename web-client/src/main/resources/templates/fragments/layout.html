<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!-- Layout base (integrante 1). Cada pantalla incluye head, navbar y footer con th:replace. -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · IntiGuard'">IntiGuard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">IntiGuard</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link disabled" href="#">Carrito</a></li>
            <li class="nav-item"><a class="nav-link disabled" href="#">Ingresar</a></li>
        </ul>
    </div>
</nav>
<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top">
    IntiGuard v2 · Seguridad electrónica · DSW II Cibertec
</footer>
</body>
</html>
