name: intiguard

# La base de datos es el MySQL de Aiven (no hay MySQL local). Las credenciales salen de .env.
# Cada integrante levanta solo lo que usa, por ejemplo: docker compose up -d ms-catalogo
# Solo hace falta la DB_PASS_* del servicio que se levanta.

x-java: &java
  restart: unless-stopped
  environment: &java-env
    JAVA_OPTS: "-Xms128m -Xmx256m"
    EUREKA_HOST: ms-discovery
    JWT_SECRET: ${JWT_SECRET:-clave-local-solo-para-desarrollo-no-usar-en-nube}
    # false hasta que exista el login (C3): el token se valida si llega, pero no es obligatorio
    EXIGIR_TOKEN: ${EXIGIR_TOKEN:-false}

x-db-service: &db-service
  <<: *java
  depends_on:
    ms-discovery:
      condition: service_healthy

x-aiven: &aiven
  AIVEN_HOST: ${AIVEN_HOST:-}
  AIVEN_PORT: ${AIVEN_PORT:-}

services:
  ms-discovery:
    <<: *java
    build: { context: ., dockerfile: ms-discovery/Dockerfile }
    image: intiguard/ms-discovery:local
    ports: ["8761:8761"]
    environment:
      <<: *java-env

  ms-auth:
    <<: *db-service
    build: { context: ., dockerfile: ms-auth/Dockerfile }
    image: intiguard/ms-auth:local
    ports: ["8081:8081"]
    environment:
      <<: [*java-env, *aiven]
      DB_PASS_AUTH: ${DB_PASS_AUTH:-}
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-}

  ms-catalogo:
    <<: *db-service
    build: { context: ., dockerfile: ms-catalogo/Dockerfile }
    image: intiguard/ms-catalogo:local
    ports: ["8082:8082"]
    environment:
      <<: [*java-env, *aiven]
      DB_PASS_CATALOGO: ${DB_PASS_CATALOGO:-}

  ms-inventario:
    <<: *db-service
    build: { context: ., dockerfile: ms-inventario/Dockerfile }
    image: intiguard/ms-inventario:local
    ports: ["8083:8083"]
    environment:
      <<: [*java-env, *aiven]
      DB_PASS_INVENTARIO: ${DB_PASS_INVENTARIO:-}

  ms-comprobantes:
    <<: *db-service
    build: { context: ., dockerfile: ms-comprobantes/Dockerfile }
    image: intiguard/ms-comprobantes:local
    ports: ["8085:8085"]
    environment:
      <<: [*java-env, *aiven]
      DB_PASS_COMPROBANTES: ${DB_PASS_COMPROBANTES:-}

  # Para probar el checkout hay que levantar también catálogo, inventario y comprobantes:
  # docker compose up -d ms-pedidos ms-catalogo ms-inventario ms-comprobantes
  ms-pedidos:
    <<: *db-service
    build: { context: ., dockerfile: ms-pedidos/Dockerfile }
    image: intiguard/ms-pedidos:local
    ports: ["8084:8084"]
    environment:
      <<: [*java-env, *aiven]
      DB_PASS_PEDIDOS: ${DB_PASS_PEDIDOS:-}

  ms-gateway:
    <<: *java
    build: { context: ., dockerfile: ms-gateway/Dockerfile }
    image: intiguard/ms-gateway:local
    ports: ["8080:8080"]
    depends_on:
      ms-discovery: { condition: service_healthy }
    environment:
      <<: *java-env

  web-client:
    <<: *java
    build: { context: ., dockerfile: web-client/Dockerfile }
    image: intiguard/web-client:local
    ports: ["8090:8090"]
    depends_on:
      ms-gateway: { condition: service_healthy }
    environment:
      <<: *java-env
      GATEWAY_URL: http://ms-gateway:8080
