# Perfil "cloud" (EC2 + RDS). Se activa con SPRING_PROFILES_ACTIVE=cloud.
# Sin valores por defecto: si falta una variable, el servicio no arranca (mejor que arrancar mal).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

intiguard:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      show-details: never
