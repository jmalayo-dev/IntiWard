        value: "8082"
      - fromGroup: intiguard-comun
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: db_catalogo
      - key: DB_USER
        value: ms_catalogo
      - key: DB_PASSWORD
        sync: false

  - type: web
    name: intiguard-inventario
    runtime: docker
    plan: free
