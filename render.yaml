      - key: PORT
        value: "8083"
      - fromGroup: intiguard-comun
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: db_inventario
      - key: DB_USER
        value: ms_inventario
      - key: DB_PASSWORD
        sync: false

  - type: web
